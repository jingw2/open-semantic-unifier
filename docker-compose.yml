services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semantic_unifier}
      POSTGRES_USER: ${POSTGRES_USER:-su_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate secrets with python3 scripts/init_env.py}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-su_admin} -d ${POSTGRES_DB:-semantic_unifier}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-22.0.1@sha256:cc8c5e545389a6aae9523beaf92eb067fdaeae59d2166093d60856f89bf7ee34
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      PHOENIX_ENABLE_AUTH: "false"
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix_data:/root/.phoenix

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-semantic-unifier}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Generate secrets with python3 scripts/init_env.py}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-su_admin}:${POSTGRES_PASSWORD:?Generate secrets with python3 scripts/init_env.py}@postgres:5432/${POSTGRES_DB:-semantic_unifier}
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      PHOENIX_ENABLED: ${PHOENIX_ENABLED:-false}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-open-semantic-unifier}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-1.0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30.0}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-semantic-unifier}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:?Generate secrets with python3 scripts/init_env.py}
      S3_BUCKET: ${S3_BUCKET:-semantic-unifier}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Generate secrets with python3 scripts/init_env.py}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:?Generate secrets with python3 scripts/init_env.py}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-su_admin}:${POSTGRES_PASSWORD:?Generate secrets with python3 scripts/init_env.py}@postgres:5432/${POSTGRES_DB:-semantic_unifier}
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      PHOENIX_ENABLED: ${PHOENIX_ENABLED:-false}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-open-semantic-unifier}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-1.0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30.0}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-semantic-unifier}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:?Generate secrets with python3 scripts/init_env.py}
      S3_BUCKET: ${S3_BUCKET:-semantic-unifier}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Generate secrets with python3 scripts/init_env.py}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:?Generate secrets with python3 scripts/init_env.py}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pg_data:
  minio_data:
  phoenix_data:
